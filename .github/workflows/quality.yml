name: Quality

# The gate, defined once and called twice: by ci.yml on pull requests and
# pushes, and by deploy.yml before an image is built. Keeping it a reusable
# workflow is what makes "a red build never reaches the server" true by
# construction rather than by two definitions agreeing.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA, tag or branch to check out (defaults to the calling event ref)'
        type: string
        required: false
        default: ''
      integration:
        # OFF because `main` currently has 9 failing integration specs, across
        # education, quality visits, the planner, invitation rate-limiting and
        # the access seed. They are not regressions — a branch-vs-main run
        # confirmed they fail identically on both — they were simply invisible,
        # because this suite has never run in CI.
        #
        # Everything needed to switch it back on is already here and working:
        # the job below, `pnpm test:int`, and the S3 env plumbing in this file
        # and in turbo.json. Flip this default to `true` once those 9 are green.
        #
        # Worth doing: adding this suite is what surfaced the
        # meeting.speech_slot:update bug that stopped system_admin editing a
        # speech slot in production.
        description: 'Run the integration suite (Testcontainers). Off until the pre-existing failures on main are fixed.'
        type: boolean
        required: false
        default: false

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated Prisma client types are needed before anything typechecks.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:cov

      - name: Build
        run: pnpm build

  integration:
    name: integration (real Postgres + Redis)
    # See the `integration` input above for why this is off by default.
    if: ${{ inputs.integration }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # No `services:` block on purpose. The suite brings up its own Postgres and
      # Redis through Testcontainers (apps/api/test/support/test-db.ts and
      # test-redis.ts), so it owns container lifecycle and schema state itself.
      # This is the suite that includes the authorisation matrix — every
      # (role x resource x action x scope) row asserted against authorize().
      #
      # The S3 values are placeholders and are never dialled: S3StorageAdapter is
      # constructed eagerly at DI time and throws when they are unset, so without
      # them every spec that boots the Nest app dies in beforeAll. Locally a
      # developer's .env supplies them; CI has no .env, so they are set here.
      - name: Integration tests
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: toastmasters-test
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
        run: pnpm test:int
