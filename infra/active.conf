# The live blue-green upstream. Imported by the Caddyfile.
#
# This file is STATE, not configuration: infra/deploy/deploy.sh rewrites it on
# the server at each cutover and reloads Caddy. The copy in git is only the seed
# for a first deploy — CI never overwrites an existing one on the host, or every
# deploy would reset the live color.
#
# Rewritten in place (`printf > active.conf`), never `mv`: it is bind-mounted
# into the Caddy container, and replacing the file would swap the inode and
# leave the container holding the old one.
reverse_proxy dashboard-blue:3000
